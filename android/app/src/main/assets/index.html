<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#10121c'><title>YUKI</title><style>*{box-sizing:border-box}body{margin:0;background:#10121c;color:#f4f4fa;font:16px system-ui}main{max-width:760px;margin:auto;padding:20px;min-height:100dvh;display:flex;flex-direction:column;gap:14px}header{display:flex;align-items:center;gap:14px}.avatar{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#b5a1ff,#f3b8d2);color:#211b35;font-size:30px;font-weight:bold}.panel{background:#1b1e2b;border:1px solid #34384a;border-radius:18px;padding:15px}#chat{flex:1;min-height:220px;max-height:48vh;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{padding:12px;border-radius:15px;max-width:90%;white-space:pre-wrap;line-height:1.45}.you{align-self:flex-end;background:#45406c}.yuki{align-self:flex-start;background:#292d40}textarea{width:100%;min-height:60px;background:#121522;color:white;border:0;padding:10px;font:inherit}button{border:0;border-radius:12px;padding:12px 16px;background:#b9a8ff;color:#191426;font-weight:650;margin:4px}.secondary{background:#34384a;color:white}small,#status{color:#bdb7d7}</style></head><body><main><header><div class='avatar'>Y</div><div><h2 style='margin:0'>YUKI</h2><small>Personal AI · Tamil + English</small></div></header><section class='panel'><b>YUKI portrait</b><p>Portrait placeholder. A chosen original YUKI character and talking-avatar animation will be added in a later milestone.</p></section><section id='chat' class='panel'><div class='bubble yuki'>Hi! Naan YUKI. Enna help venum?</div></section><section class='panel'><textarea id='msg' placeholder='Type or speak...'></textarea><button id='send'>Send</button><button class='secondary' id='mic'>Speak</button><button class='secondary' id='stop'>Stop voice</button><p id='status'>Ready</p></section><section class='panel'><b>Teach YUKI from a correction</b><textarea id='note' placeholder='Write a correction or preference to remember'></textarea><button class='secondary' id='save'>Save correction</button></section></main><script>const $=x=>document.getElementById(x),chat=$('chat');function add(t,k){let d=document.createElement('div');d.className='bubble '+k;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function say(t){if(window.YukiNative){YukiNative.speak(t);return}if(window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';speechSynthesis.speak(u)}}window.onYukiResult=t=>{$('msg').value=t;$('status').textContent='Recognized'};window.onYukiStatus=t=>$('status').textContent=t;window.onYukiError=t=>$('status').textContent=t;async function send(){let message=$('msg').value.trim();if(!message)return;$('msg').value='';add(message,'you');$('status').textContent='YUKI is thinking...';try{let r=await fetch('https://YOUR-BACKEND-URL/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});let j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');add(j.reply,'yuki');say(j.reply);$('status').textContent='Ready'}catch(e){add('Backend not connected yet. Deploy the backend and replace YOUR-BACKEND-URL.','yuki');$('status').textContent='Backend setup required'}}$('send').onclick=send;$('msg').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('stop').onclick=()=>window.YukiNative?YukiNative.stopSpeaking():speechSynthesis?.cancel();$('mic').onclick=()=>window.YukiNative?YukiNative.listen():$('status').textContent='Use Android app for microphone input';$('save').onclick=async()=>{let note=$('note').value.trim();if(!note)return;try{let r=await fetch('https://YOUR-BACKEND-URL/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note})});if(r.ok){$('note').value='';$('status').textContent='Correction saved'}}catch(e){$('status').textContent='Backend setup required'}};</script></body></html>
